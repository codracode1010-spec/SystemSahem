<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>تسجيل الدخول — نظام تقارير المتبرعين</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="login-page">
      <form id="loginForm" class="login-card" autocomplete="on">
        <div class="brand login-brand">
          <div class="brand-icon">
            <img
              src="images/logo.png"
              alt="brand-icon"
              onerror="this.style.display='none'"
            />
          </div>

          <div>
            <h1>نظام تقارير المتبرعين</h1>
            <p>سجّل الدخول للمتابعة</p>
          </div>
        </div>

        <label class="login-label" for="username">اسم المستخدم</label>
        <input
          id="username"
          class="login-input"
          type="text"
          autocomplete="username"
          placeholder="اسم المستخدم"
          required
        />

        <label class="login-label" for="password">كلمة المرور</label>
        <input
          id="password"
          class="login-input"
          type="password"
          autocomplete="current-password"
          placeholder="كلمة المرور"
          required
        />

        <p id="loginError" class="login-error" aria-live="polite"></p>

        <button id="loginBtn" class="btn btn-primary login-submit" type="submit">
          دخول
        </button>
      </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-auth-compat.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
